<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Katalog Template – ArinEmir Digital Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #b38b59; /* Antique Gold */
      --secondary: #6b4f4f; /* Warm Earth */
      --accent: #eecda3;
      --light: #fdfbf9;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.8);
      --border: rgba(179, 139, 89, 0.15);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--secondary);
    }

    header {
      background: var(--glass);
      backdrop-filter: blur(10px);
      padding: 1.2rem 8%;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
    .nav-links a {
      margin-left: 2.5rem;
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }

    .nav-links a:hover { color: var(--primary); }

    .catalog-header {
      text-align: center;
      padding: 7rem 5% 3rem;
    }
    .catalog-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      margin-bottom: 1rem;
    }
    .filter-bar {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.3s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--secondary);
      color: white;
      border-color: var(--secondary);
    }

    .templates-section {
      padding: 2rem 8% 6rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2.5rem 3rem;
    }

    .template-card {
      background: var(--white);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      position: relative;
      border-radius: 8px;
    }
    
    .template-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .img-container {
      position: relative;
      width: 100%;
      height: 460px;
      overflow: hidden;
    }

    .template-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .template-card:hover img {
      transform: scale(1.06);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(45, 24, 24, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .template-card:hover .overlay {
      opacity: 1;
    }

    .template-info {
      padding: 1.6rem 1.4rem;
      text-align: center;
    }

    .template-info h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
    }

    .template-info p {
      font-size: 0.88rem;
      color: #666;
      margin-bottom: 1rem;
      line-height: 1.45;
    }

    .tag {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 0.6rem;
      display: block;
    }

    .btn-demo {
      background: var(--white);
      color: var(--secondary);
      padding: 0.75rem 1.9rem;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      border: 1px solid var(--secondary);
    }

    .btn-order {
      display: block;
      width: 100%;
      padding: 1rem;
      background: var(--secondary);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-order:hover {
      background: var(--primary);
    }

    .pagination {
      margin-top: 4rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .page-btn {
      background: var(--white);
      border: 1px solid var(--border);
      padding: 0.7rem 1.3rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .page-btn:hover,
    .page-btn.active {
      background: var(--secondary);
      color: white;
      border-color: var(--secondary);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      padding: 4rem 0;
      font-size: 1.1rem;
      color: #777;
    }

    @media (max-width: 1024px) {
      .templates-grid { gap: 2rem; }
    }

    @media (max-width: 768px) {
      .templates-grid { grid-template-columns: 1fr; }
      .img-container { height: 420px; }
      nav { flex-direction: column; gap: 1rem; align-items: center; }
      .nav-links {
        display: grid;
        grid-template-columns: repeat(2, max-content);
        justify-content: center;
        column-gap: 2rem;
        row-gap: .5rem;
      }

      .nav-links a {
        margin: 0;
      }

      /* Put HARGA in the second row and center it */
      .nav-links a:last-child {
        grid-column: 1 / 3;
        justify-self: center;
      }
    }
  </style>
</head>
<body>

<header>
  <nav>
    <div class="logo">Aurelia.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="/pages/template.html">Templates</a>
      <a href="/pages/pricing.html">Harga</a>
    </div>
  </nav>
</header>

<section class="catalog-header">
  <span style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; color: var(--primary); font-weight: 700;">Pilih Tema Impian</span>
  <h1>Koleksi Desain Kami</h1>
  <p>Pilih dari berbagai gaya desain yang dikurasi khusus untuk hari istimewa Anda.</p>
  
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">Semua</button>
    <button class="filter-btn" data-filter="modern">Modern</button>
    <button class="filter-btn" data-filter="minimalis">Minimalis</button>
    <button class="filter-btn" data-filter="classic">Classic</button>
    <button class="filter-btn" data-filter="floral">Floral</button>
    <button class="filter-btn" data-filter="luxury">Luxury</button>
    <button class="filter-btn" data-filter="boho">Boho</button>
  </div>
</section>

<main class="templates-section">
  <div id="loading" class="loading">Memuat koleksi template...</div>
  <div class="templates-grid" id="templatesGrid" style="display:none;"></div>

  <div class="pagination" id="pagination" style="display:none;"></div>
</main>

<footer style="background: var(--secondary); color: white; padding: 4rem 8%; text-align: center;">
  <p style="font-size: 0.9rem; opacity: 0.8;">© 2026 ArinEmir Digital Invitation. Crafted in Bandung.</p>
</footer>

<script>
const ITEMS_PER_PAGE = 6;
let currentPage = 1;
let currentFilter = "all";
let templates = [];

const grid = document.getElementById("templatesGrid");
const pagination = document.getElementById("pagination");
const loading = document.getElementById("loading");

function renderTemplates(page = 1, filter = "all") {
  grid.innerHTML = "";

  const filtered = filter === "all" 
    ? templates 
    : templates.filter(t => t.category === filter);

  const start = (page - 1) * ITEMS_PER_PAGE;
  const end = start + ITEMS_PER_PAGE;
  const pageItems = filtered.slice(start, end);

  pageItems.forEach(t => {
    const card = document.createElement("div");
    card.className = "template-card";
    card.innerHTML = `
      <div class="img-container">
        <img src="${t.img}" alt="${t.title}" loading="lazy">
        <div class="overlay">
          <a href="${t.demoUrl}" target="_blank" class="btn-demo">Lihat Demo</a>
        </div>
      </div>
      <div class="template-info">
        <span class="tag">${t.tag}</span>
        <h3>${t.title}</h3>
        <p>${t.desc}</p>
      </div>
      <a href="../../?theme=${t.id}&couple=demo" target="_blank" class="btn-order">Gunakan Template Ini</a>
    `;
    grid.appendChild(card);
  });

  renderPagination(filtered.length, page);
}

function renderPagination(totalItems, current) {
  pagination.innerHTML = "";
  const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
  if (totalPages <= 1) return;

  const prev = document.createElement("button");
  prev.className = "page-btn";
  prev.textContent = "‹ Sebelumnya";
  prev.disabled = current === 1;
  prev.addEventListener("click", () => {
    if (current > 1) {
      currentPage = current - 1;
      renderTemplates(currentPage, currentFilter);
    }
  });
  pagination.appendChild(prev);

  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.className = "page-btn" + (i === current ? " active" : "");
    btn.textContent = i;
    btn.addEventListener("click", () => {
      currentPage = i;
      renderTemplates(currentPage, currentFilter);
    });
    pagination.appendChild(btn);
  }

  const next = document.createElement("button");
  next.className = "page-btn";
  next.textContent = "Selanjutnya ›";
  next.disabled = current === totalPages;
  next.addEventListener("click", () => {
    if (current < totalPages) {
      currentPage = current + 1;
      renderTemplates(currentPage, currentFilter);
    }
  });
  pagination.appendChild(next);
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    currentFilter = btn.dataset.filter;
    currentPage = 1;
    renderTemplates(1, currentFilter);
  });
});

// Fetch JSON data
fetch('../data/templates.json')
  .then(response => {
    if (!response.ok) throw new Error('Gagal memuat templates.json');
    return response.json();
  })
  .then(data => {
    templates = data;
    loading.style.display = 'none';
    grid.style.display = 'grid';
    pagination.style.display = 'flex';
    renderTemplates();
  })
  .catch(err => {
    loading.textContent = 'Gagal memuat template. Silakan coba refresh halaman.';
    console.error(err);
  });
</script>

</body>
</html>
