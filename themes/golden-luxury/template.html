<div id="wedding-root" class="min-h-screen bg-[#0f0f0f] text-[#d4af37] selection:bg-amber-900 overflow-x-hidden font-serif">
  <div id="heart-container" class="fixed inset-0 pointer-events-none z-0"></div>

  <section class="relative h-screen flex items-center justify-center overflow-hidden border-b-4 border-[#d4af37]">
    <div id="hero-bg" class="absolute inset-0 bg-cover bg-center transition-transform duration-[25s] scale-100 group-hover:scale-110">
      <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-black/20 to-black/90"></div>
    </div>
    
    <div class="absolute inset-10 border border-[#d4af37]/30 pointer-events-none"></div>
    <div class="absolute inset-12 border-2 border-[#d4af37]/10 pointer-events-none"></div>

    <div class="relative text-center space-y-8 px-4">
      <div class="flex items-center justify-center gap-4 mb-4">
        <div class="h-[1px] w-12 bg-[#d4af37]"></div>
        <span class="text-xs tracking-[0.6em] uppercase text-white font-light" data-tagline></span>
        <div class="h-[1px] w-12 bg-[#d4af37]"></div>
      </div>
      
      <h1 class="text-6xl md:text-9xl font-extralight italic leading-none text-white drop-shadow-[0_5px_15px_rgba(212,175,55,0.5)]">
        <span data-groom-short></span> <span class="text-[#d4af37]">&</span> <span data-bride-short></span>
      </h1>
      
      <div class="py-4 border-y border-[#d4af37]/40 inline-block px-12">
        <p class="text-xl md:text-2xl tracking-[0.3em] font-light text-white" data-date-str></p>
      </div>

      <div class="pt-10">
         <button onclick="document.getElementById('grand-profile').scrollIntoView({behavior: 'smooth'})"
          class="group relative px-12 py-4 overflow-hidden bg-transparent border border-[#d4af37] text-[#d4af37] hover:text-black transition-all duration-500 uppercase tracking-widest text-sm">
           <span class="relative z-10 font-bold">Open Invitation</span>
           <div class="absolute inset-0 bg-[#d4af37] translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
         </button>
      </div>
    </div>
  </section>

  <section id="grand-profile" class="py-32 px-4 relative z-10 bg-gradient-to-b from-[#0f0f0f] to-[#1a1a1a]">
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-20">
      
      <div class="relative">
        <div class="relative z-10 p-2 bg-[#d4af37] rounded-t-full">
           <div class="overflow-hidden rounded-t-full aspect-[3/4]">
             <img id="groom-img" src="" class="w-full h-full object-cover">
           </div>
        </div>
        <div class="bg-black border-x border-b border-[#d4af37] p-10 text-center shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
          <h3 class="text-sm tracking-[0.4em] uppercase text-[#d4af37] mb-4">The Groom</h3>
          <h2 class="text-4xl text-white mb-4" data-groom></h2>
          <p class="text-stone-400 italic leading-relaxed" data-groom-parent></p>
        </div>
      </div>

      <div class="relative mt-0 md:mt-24">
        <div class="relative z-10 p-2 bg-[#d4af37] rounded-t-full">
           <div class="overflow-hidden rounded-t-full aspect-[3/4]">
             <img id="bride-img" src="" class="w-full h-full object-cover">
           </div>
        </div>
        <div class="bg-black border-x border-b border-[#d4af37] p-10 text-center shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
          <h3 class="text-sm tracking-[0.4em] uppercase text-[#d4af37] mb-4">The Bride</h3>
          <h2 class="text-4xl text-white mb-4" data-bride></h2>
          <p class="text-stone-400 italic leading-relaxed" data-bride-parent></p>
        </div>
      </div>

    </div>
  </section>
</div>
