<div id="wedding-root">
<div id="invitation-content">

<div class="hero">
  <div class="bg-layer"></div>
  <div class="content">
    <div class="frame">
      <h1 data-groom-short></h1>
      <div class="heart">+</div>
      <h1 data-bride-short></h1>
    </div>
    <div class="date" data-date-str></div>
    <p class="tag" data-tagline></p>
  </div>
</div>

<section class="moments" style="padding-bottom: 0;">
  <div class="moment">
    <h2 data-groom></h2>
    <p class="where" style="font-style: italic;" data-groom-parent></p>
    <a id="groom-ig" target="_blank" class="place" style="display:block; margin-top:1rem; font-size:1rem; color:var(--accent);"></a>
  </div>
  <div class="moment">
    <h2 data-bride></h2>
    <p class="where" style="font-style: italic;" data-bride-parent></p>
    <a id="bride-ig" target="_blank" class="place" style="display:block; margin-top:1rem; font-size:1rem; color:var(--accent);"></a>
  </div>
</section>

<section class="boho-gallery" style="background: white;" data-plan-feature="story">
  <h2 style="font-size: 3rem;">Kisah Kami</h2>
  <div id="story-list" style="max-width: 700px; margin: 0 auto; text-align: left; padding: 0 2rem;">
    </div>
</section>

<section class="moments">
  <div class="moment akad">
    <h2 data-ceremony-title></h2>
    <div class="place" data-ceremony-venue></div>
    <div class="when" data-ceremony-time></div>
    <div class="where" data-ceremony-address></div>
    <p class="where" style="font-size: 0.9rem; margin-top: 1rem; color: var(--accent);" data-ceremony-note></p>
  </div>

  <div class="moment resepsi">
    <h2 data-reception-title></h2>
    <div class="place" data-reception-venue></div>
    <div class="when" data-reception-time></div>
    <div class="where" data-reception-address></div>
    <p class="where" style="font-size: 0.9rem; margin-top: 1rem; color: var(--accent);" data-reception-note></p>
  </div>
</section>

<section class="moments" data-plan-feature="livestream">
  <div class="moment" style="max-width: 600px;">
    <h2>Live Streaming</h2>
    <p class="where" style="margin-bottom: 1.5rem;">Tidak bisa hadir langsung? Saksikan momen sakral kami secara live.</p>
    <div style="aspect-ratio: 16/9; background: #2b2b2b; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); font-size: 0.95rem; text-align: center; padding: 1rem;">
      <span id="livestream-status">▶ Live streaming akan dimulai pada hari-H</span>
    </div>
    <a id="livestream-link" href="#" class="place" style="display:inline-block; margin-top:1.5rem; background:var(--accent); color:white; padding:0.7rem 1.8rem; border-radius:999px; text-decoration:none; font-size:1rem; transition: opacity 0.2s ease;">Tonton di YouTube</a>
  </div>
</section>

<section class="moments" data-plan-feature="rsvp">
  <div class="moment" style="max-width: 520px;">
    <h2>RSVP</h2>
    <p class="where" style="margin-bottom: 1.5rem;">Mohon konfirmasi kehadiran Anda melalui form berikut.</p>
    <form style="display:flex; flex-direction:column; gap:1rem; text-align:left;" onsubmit="event.preventDefault(); alert('Ini mode preview — RSVP tidak benar-benar terkirim.');">
      <input type="text" placeholder="Nama Anda" style="padding:0.9rem 1rem; border-radius:12px; border:1px solid rgba(201,124,93,0.3); background:var(--bg); font-family:inherit; font-size:1rem; color:inherit;">
      <select style="padding:0.9rem 1rem; border-radius:12px; border:1px solid rgba(201,124,93,0.3); background:var(--bg); font-family:inherit; font-size:1rem; color:inherit;">
        <option>Hadir</option>
        <option>Tidak Hadir</option>
        <option>Masih Ragu</option>
      </select>
      <textarea rows="3" placeholder="Ucapan & Doa" style="padding:0.9rem 1rem; border-radius:12px; border:1px solid rgba(201,124,93,0.3); background:var(--bg); font-family:inherit; font-size:1rem; color:inherit;"></textarea>
      <button type="submit" style="padding:0.9rem; border:none; border-radius:999px; background:var(--accent); color:white; font-size:1rem; font-weight:600; cursor:pointer;">Kirim RSVP</button>
    </form>
  </div>
</section>

<section class="boho-gallery" data-plan-feature="gift">
  <h2 style="font-size: 2.5rem;">Tanda Kasih</h2>
  <div id="gift-list" class="polaroid-grid" style="gap: 1.5rem;">
    </div>
</section>

<section class="gallery boho-gallery">
  <h2>Jejak Cinta Kami</h2>
  <div class="polaroid-grid" id="polaroid-grid"></div>
</section>

<footer class="footer">
  <div class="note" style="margin-bottom: 3rem;">
    <p data-footer-quote></p>
    <strong data-footer-verse style="display:block; margin-top: 1rem; color: var(--accent);"></strong>
  </div>
  <div class="note" data-footer-message></div>
  <div class="love" data-footer-closing></div>
</footer>

</div>
<!-- ^ /invitation-content -->
<div class="leaves"></div>
</div>
