<div id="wedding-root" class="min-h-screen bg-[#1a0505] text-[#f4e4bc] selection:bg-red-900 overflow-x-hidden font-serif">
  <div id="heart-container" class="fixed inset-0 pointer-events-none z-0"></div>

  <section class="relative h-screen flex flex-col md:flex-row overflow-hidden border-b border-amber-900/30">
    <div class="w-full md:w-1/2 h-1/2 md:h-full relative overflow-hidden">
      <div id="hero-bg" class="absolute inset-0 bg-cover bg-center transition-transform duration-[20s] hover:scale-110"></div>
      <div class="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-l from-[#1a0505] via-transparent to-transparent"></div>
    </div>
    
    <div class="w-full md:w-1/2 h-1/2 md:h-full flex items-center justify-center p-8 bg-[#1a0505] relative z-10">
      <div class="max-w-md text-center md:text-left space-y-6">
        <div class="inline-block px-4 py-1 border border-amber-600 text-amber-500 text-xs tracking-[0.5em] uppercase mb-4" data-tagline></div>
        <h1 class="text-6xl md:text-8xl font-light leading-none">
          <span class="block text-white" data-groom-short></span>
          <span class="block text-amber-500 my-2">&</span>
          <span class="block text-white" data-bride-short></span>
        </h1>
        <p class="text-xl tracking-widest text-amber-200/70 italic" data-date-str></p>
        <button onclick="document.getElementById('profile-section').scrollIntoView({behavior: 'smooth'})"
          class="mt-8 px-12 py-4 bg-transparent border border-amber-600 text-amber-500 hover:bg-amber-600 hover:text-white transition-all duration-500 uppercase tracking-widest text-sm">
          Enter Gallery
        </button>
      </div>
    </div>
  </section>

  <section id="profile-section" class="py-32 px-4 relative z-10 max-w-7xl mx-auto">
    <div class="grid md:grid-cols-12 gap-0 items-center">
      
      <div class="md:col-span-7 relative group mb-20 md:mb-0">
        <div class="aspect-[4/5] overflow-hidden rounded-sm border border-amber-900/50 shadow-2xl">
          <img id="groom-img" src="" class="w-full h-full object-cover">
        </div>
        <div class="absolute -bottom-10 -right-4 md:right-10 bg-[#2a0a0a] border border-amber-600/30 p-8 shadow-2xl max-w-xs">
          <h3 class="text-amber-500 text-xs tracking-widest uppercase mb-2">The Groom</h3>
          <h2 class="text-3xl text-white mb-2" data-groom></h2>
          <p class="text-stone-400 text-sm italic" data-groom-parent></p>
        </div>
      </div>

      <div class="md:col-span-7 md:col-start-6 relative group mt-12 md:-mt-32">
        <div class="aspect-[4/5] overflow-hidden rounded-sm border border-amber-900/50 shadow-2xl">
          <img id="bride-img" src="" class="w-full h-full object-cover">
        </div>
        <div class="absolute -top-10 -left-4 md:left-10 bg-[#2a0a0a] border border-amber-600/30 p-8 shadow-2xl max-w-xs">
          <h3 class="text-amber-500 text-xs tracking-widest uppercase mb-2">The Bride</h3>
          <h2 class="text-3xl text-white mb-2" data-bride></h2>
          <p class="text-stone-400 text-sm italic" data-bride-parent></p>
        </div>
      </div>

    </div>
  </section>

  <section class="py-24 bg-[#140404] border-y border-amber-900/20">
    <div class="max-w-4xl mx-auto px-4 text-center">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="p-6 border-r border-amber-900/30">
          <div id="days" class="text-5xl font-light text-white">0</div>
          <div class="text-[10px] uppercase tracking-[0.3em] text-amber-600 mt-2">Days</div>
        </div>
        <div class="p-6 md:border-r border-amber-900/30">
          <div id="hours" class="text-5xl font-light text-white">0</div>
          <div class="text-[10px] uppercase tracking-[0.3em] text-amber-600 mt-2">Hours</div>
        </div>
        <div class="p-6 border-r border-amber-900/30">
          <div id="minutes" class="text-5xl font-light text-white">0</div>
          <div class="text-[10px] uppercase tracking-[0.3em] text-amber-600 mt-2">Mins</div>
        </div>
        <div class="p-6">
          <div id="seconds" class="text-5xl font-light text-white">0</div>
          <div class="text-[10px] uppercase tracking-[0.3em] text-amber-600 mt-2">Secs</div>
        </div>
      </div>
    </div>
  </section>
</div>
