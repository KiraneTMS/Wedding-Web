<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Digital</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff8f6;
      font-family: system-ui, sans-serif;
      color: #444;
    }
    .loading {
      font-size: 1.3rem;
      color: #e91e63;
    }
  </style>
</head>
<body>

<div class="loading">Memuat undangan...</div>

<div id="root" style="display:none;"></div>

<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
// Everything is wrapped in this function so an early `return` can be used
// to stop execution when couple/theme is missing — a bare top-level
// `return` is a SyntaxError even inside a <script type="module">.
function main() {
  // Extract subdomain (couple) and pathname (theme)
  const hostname = location.hostname;

  // Treat literal IP addresses (e.g. 127.0.0.1) as "no subdomain" — an IP's
  // dotted parts would otherwise be mistaken for one.
  const isIpAddress = /^\d{1,3}(\.\d{1,3}){3}$/.test(hostname);

  // Local dev quirk: "demo.localhost" only has 2 dot-separated parts
  // (no ".com"-style TLD), while a real subdomain like "demo.example.com"
  // has 3. Detect the ".localhost" suffix separately so local subdomain
  // testing (e.g. couple.localhost:8000) behaves the same as production.
  const isLocalhostSubdomain = hostname.endsWith('.localhost');
  const hostParts = hostname.split('.');
  const hasSubdomain = isLocalhostSubdomain
    ? hostParts.length > 1   // "demo.localhost" -> ["demo","localhost"]
    : hostParts.length > 2;  // "demo.example.com" -> ["demo","example","com"]

  let couple = null;

  // If visiting a subdomain like "rendiputri.yourdomain.com" (or "demo.yourdomain.com" —
  // demo is treated as a normal couple subdomain, not a special case, so previews
  // behave identically to real couple links)
  if (!isIpAddress && hostname !== 'localhost' && hasSubdomain && hostParts[0] !== 'www') {
    couple = hostParts[0]; // "rendiputri" or "demo"
  } else {
    // Fallback to URL search parameter if not on a custom subdomain
    couple = new URLSearchParams(location.search).get('couple');
  }

  // Extract theme from path (e.g. "/rose" -> "rose") or query parameter
  let theme = location.pathname.replace(/^\/+|\/+$/g, ''); 
  if (!theme) {
    theme = new URLSearchParams(location.search).get('theme');
  }

  // Redirect to fallback if either parameter is missing.
  // IMPORTANT: location.replace() queues navigation but doesn't stop
  // script execution — without `return`, the code below would keep
  // running (with theme/couple still null) before the browser actually
  // navigates away, causing bogus fetches like `data/null.json` and,
  // if the redirect target also lands back here, an infinite loop.
  if (!theme || !couple) {
    window.location.replace('/pages/index.html');
    return;
  }

  // ────────────────────────────────────────────────
  // Hanya sampai sini jika ada parameter → lanjut load undangan
  // ────────────────────────────────────────────────
  // ==========================================================
  // Shared Plan Preview + Order Widget
  // Works with ANY theme, as long as the theme follows the shared
  // conventions: content wrapped in #wedding-root > #invitation-content,
  // optional sections tagged data-plan-feature="story|gift|rsvp|livestream",
  // and (optionally) a .pw-font-alt CSS hook for the font-toggle feature.
  // No per-theme JS/CSS/HTML needed — this is injected once, here.
  // ==========================================================

  const PLAN_FEATURES = {
    basic:     { story: false, gift: false, rsvp: false, livestream: false, customize: false, label: 'Basic',     icon: '🌸' },
    premium:   { story: true,  gift: true,  rsvp: true,  livestream: true,  customize: true,  label: 'Premium',   icon: '💍' },
    exclusive: { story: true,  gift: true,  rsvp: true,  livestream: true,  customize: true,  label: 'Exclusive', icon: '👑' }
  };
  const PLAN_PRICE = { basic: 150000, premium: 200000, exclusive: 300000 };
  const PLAN_LABEL_FULL = { basic: '🌸 Basic', premium: '💍 Premium', exclusive: '👑 Exclusive' };

  // TODO: ganti dengan nomor WhatsApp admin (format 62xxxxxxxxxx, tanpa +/spasi/strip)
  const WHATSAPP_NUMBER = '6288269681231';

  // TODO: sesuaikan daftar tambahan fitur sesuai layanan Anda.
  // Tidak ada harga tetap di sini — sesuai list yang diberikan, harga
  // tambahan fitur dikonfirmasi manual lewat WhatsApp.
  const ADDONS = [
    { id: 'illustration', label: '✨ Ilustrasi Custom Tambahan', price: 100000 },
    { id: 'prewed',       label: '🎥 Section Video Pre-Wedding', price: 50000 },
    { id: 'animation',    label: '🌸 Efek Animasi Premium', price: 35000 },
    { id: 'domain',       label: '🌐 Custom Domain (1 Tahun)', price: 50000 },
    { id: 'rsvp-dash',    label: '📊 Dashboard RSVP', price: 40000 },
    { id: 'gallery-cap',  label: '📸 Galeri Unlimited', price: 25000 },
    { id: 'savethedate',  label: '📅 Halaman Save the Date', price: 20000 },
    { id: 'thankyou',     label: '🎉 Halaman Thank You', price: 15000 },
    { id: 'guestbook',    label: '💌 Buku Tamu Digital', price: 25000 },
    { id: 'bilingual',    label: '🌍 Bahasa Indonesia & English', price: 30000 }
  ];

  let currentPlanKey = 'exclusive';

  function formatRupiah(n) {
    return 'Rp ' + n.toLocaleString('id-ID');
  }

  // Turns a theme folder slug like "boho-rustic" into "Boho Rustic".
  // Fill THEME_LABELS in if you want nicer/custom names per theme.
  const THEME_LABELS = {
    // rose: 'Rose Romance',
    // boho: 'Boho Rustic',
  };
  function themeLabel(slug) {
    return THEME_LABELS[slug] || slug.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function applyPlan(planKey) {
    const feat = PLAN_FEATURES[planKey];
    if (!feat) return;
    currentPlanKey = planKey;

    document.querySelectorAll('[data-plan-feature]').forEach(el => {
      const key = el.getAttribute('data-plan-feature');
      el.classList.toggle('hidden', !feat[key]);
    });

    const label = document.getElementById('pw-plan-label');
    const icon = document.getElementById('pw-plan-icon');
    if (label) label.textContent = feat.label;
    if (icon) icon.textContent = feat.icon;

    const customizeRow = document.getElementById('pw-customize-row');
    if (customizeRow) customizeRow.classList.toggle('hidden', !feat.customize);

    const wroot = document.getElementById('wedding-root');
    if (wroot) wroot.classList.toggle('is-exclusive', planKey === 'exclusive');

    const bar = document.getElementById('pw-exclusive-bar');
    if (bar) bar.classList.toggle('pw-show', planKey === 'exclusive');

    // Reset color/font customization when downgrading away from the feature
    if (!feat.customize) {
      const content = document.getElementById('invitation-content');
      if (content) { content.style.filter = ''; content.classList.remove('pw-font-alt'); }
    }
  }

  function injectPlanWidgetStyles() {
    if (document.getElementById('pw-styles')) return;
    const style = document.createElement('style');
    style.id = 'pw-styles';
    style.textContent = `
      #pw-exclusive-bar {
        position: fixed; top: 0; left: 0; right: 0; height: 4px;
        background: linear-gradient(90deg, #f0b429, #fda4af, #f0b429);
        background-size: 200% 100%;
        animation: pw-shimmer 3s linear infinite;
        z-index: 99997; opacity: 0; transition: opacity .3s; pointer-events: none;
      }
      #pw-exclusive-bar.pw-show { opacity: 1; }
      @keyframes pw-shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

      .pw-swatch {
        width: 1.5rem; height: 1.5rem; border-radius: 9999px; cursor: pointer;
        border: 2px solid transparent; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
      }
      .pw-swatch.pw-swatch-active { border-color: #1e293b; }
    `;
    document.head.appendChild(style);
  }

  function buildWidgetMarkup() {
    const message = `Halo, saya ingin memesan undangan digital 💌\n\nTema: ${themeLabel(theme)}`;
    const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;

    return `
      <div id="pw-exclusive-bar"></div>

      <div class="fixed bottom-5 right-5 z-[99998] flex flex-col items-end gap-3 font-sans">
        <a id="pw-order-btn" href="${waUrl}" target="_blank" class="flex items-center gap-2 pl-4 pr-5 py-3 bg-emerald-600 text-white rounded-full shadow-xl hover:bg-emerald-700 transition-all duration-300 text-sm font-semibold no-underline">
          🛒 Pesan Sekarang
        </a>
      </div>
    `;
  }

  function initPlanWidget(theme, data) {
    injectPlanWidgetStyles();
    document.body.insertAdjacentHTML('beforeend', buildWidgetMarkup());

    // Handle swatch/color pickers if present
    document.querySelectorAll('.pw-swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        const content = document.getElementById('invitation-content');
        if (content) content.style.filter = btn.dataset.hue === '0' ? '' : `hue-rotate(${btn.dataset.hue}deg)`;
        document.querySelectorAll('.pw-swatch').forEach(b => b.classList.remove('pw-swatch-active'));
        btn.classList.add('pw-swatch-active');
      });
    });

    const fontToggle = document.getElementById('pw-font-toggle');
    if (fontToggle) {
      fontToggle.addEventListener('click', () => {
        const content = document.getElementById('invitation-content');
        if (content) content.classList.toggle('pw-font-alt');
      });
    }

    applyPlan(currentPlanKey);
  }

  async function loadInvitation() {
    try {
      // Absolute paths (leading "/") are required here — with path-based
      // theme routing (e.g. /pink-romantic), a relative path would resolve
      // against that URL segment instead of the actual site root.
      const dataRes = await fetch(`/data/${couple}.json`);
      if (!dataRes.ok) throw new Error('Data pasangan tidak ditemukan');

      const data = await dataRes.json();

      const now = new Date();
      const from = new Date(data.activeFrom);
      const until = new Date(data.activeUntil);

      if (isNaN(from.getTime()) || isNaN(until.getTime())) {
        throw new Error('Format tanggal aktif tidak valid');
      }

      if (now < from || now >= until) {
        throw new Error('Undangan belum atau sudah tidak aktif');
      }

      const [htmlRes, cssRes] = await Promise.all([
        fetch(`/themes/${theme}/template.html`),
        fetch(`/themes/${theme}/style.css`)
      ]);

      if (!htmlRes.ok) throw new Error(`Template ${theme} tidak ditemukan`);
      if (!cssRes.ok)  throw new Error(`Style ${theme} tidak ditemukan`);

      const html = await htmlRes.text();
      const css  = await cssRes.text();

      const style = document.createElement('style');
      style.textContent = css;
      document.head.appendChild(style);

      // Force full page scroll & visibility
      const forceFixStyle = document.createElement('style');
      forceFixStyle.textContent = `
        html, body {
          height: auto !important;
          min-height: 100% !important;
          overflow-y: auto !important;
          overflow-x: hidden !important;
          scroll-behavior: smooth;
          margin: 0 !important;
          padding: 0 !important;
          /* body was a flex container (display:flex; align-items:center;
             justify-content:center) just for centering the loading text.
             Left in place, it makes #root a shrink-to-fit flex item
             instead of a full-width block, which distorts the real
             invitation's layout. Reset it back to normal block flow. */
          display: block !important;
        }
        #root {
          width: 100% !important;
        }
        #root, #root > * {
          min-height: auto !important;
          height: auto !important;
          overflow: visible !important;
          display: block !important;
        }
        .loading {
          display: none !important;
        }
        /* Override common hero locking rules */
        .hero, .hero-header, header, .hero-content, .wrapper {
          position: relative !important;
          top: 0 !important;
          height: auto !important;
          min-height: 60vh !important;
          overflow: visible !important;
        }
      `;
      document.head.appendChild(forceFixStyle);

      // Force scroll to top after render
      setTimeout(() => {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }, 600);

      const root = document.getElementById('root');
      if (!root) throw new Error('Elemen #root tidak ditemukan di HTML');
      root.innerHTML = html;
      root.style.display = 'block';

      document.querySelector('.loading').style.display = 'none';

      const script = document.createElement('script');
      script.src = `/themes/${theme}/script.js?v=${Date.now()}`;
      document.body.appendChild(script);

      script.onload = () => {
        setTimeout(() => {
          if (typeof window.initTheme === 'function') {
            window.initTheme(data);
            document.title = `${data.groom.name} × ${data.bride.name}`;
            initPlanWidget(theme, data);
          } else {
            console.warn('initTheme tidak ditemukan di script tema:', theme);
            root.innerHTML += `
              <div style="padding:3rem; text-align:center; color:#c62828; background:#ffebee; border-radius:12px; margin:2rem;">
                <h3>Debug: Fungsi initTheme tidak ditemukan</h3>
                <p>File: <code>themes/${theme}/script.js</code> harus punya baris:</p>
                <pre style="background:#fff; padding:1rem; border:1px solid #ccc; border-radius:8px; display:inline-block;">
window.initTheme = initTheme;</pre>
              </div>`;
          }
        }, 400);
      };

      script.onerror = () => {
        console.error('Gagal memuat script tema:', theme);
        root.innerHTML += '<p style="color:#c00; text-align:center; padding:2rem;">Gagal memuat script tema</p>';
      };

    } catch (err) {
      console.error(err);
      document.querySelector('.loading').style.display = 'none';
      const root = document.getElementById('root') || document.body;
      root.style.display = 'block';
      root.innerHTML = `
        <div style="
          padding: 6rem 1.5rem;
          text-align: center;
          min-height: 80vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          color: #444;
          font-family: system-ui, sans-serif;
        ">
          <h2 style="color: #c62828; margin-bottom: 1.5rem;">Undangan Tidak Tersedia</h2>
          <p style="font-size: 1.2rem; max-width: 540px; margin: 0 auto 2rem;">
            Maaf, undangan ini belum aktif, sudah berakhir, atau tidak dapat dimuat.<br>
            Silakan hubungi mempelai untuk informasi lebih lanjut ♡
          </p>
          <small style="color: #777; font-size: 0.95rem;">${err.message}</small>
        </div>
      `;
    }
  }

  loadInvitation();
}

main();
</script>

</body>
</html>
